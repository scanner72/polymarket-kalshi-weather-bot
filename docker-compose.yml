services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: weather-bot-backend
    restart: unless-stopped
    ports:
      - "8600:8000"
    environment:
      - RAILWAY_ENVIRONMENT=docker
      - DATABASE_URL=sqlite:////app/data/tradingbot.db
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the Vite bundle at image build. The browser calls this URL,
        # so it must be a host the client can reach (not a Docker-internal name).
        # Override in .env if the dashboard is opened from another machine.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8600}
    container_name: weather-bot-frontend
    restart: unless-stopped
    ports:
      - "3600:80"
    depends_on:
      - backend
